<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner | Personal Finance tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <script src="/script.js"></script>
        <div class="navMenu">
        <ul>
            <li class="text"><a href="/index.html">Dashboard</a></li>
            <li class="text"><a href="/assects/pages/income.html">Income</a></li>
            <li class="text"><a href="/assects/pages/expenses.html">Expenses</a></li>
            <li class="text"><a href="/assects/pages/budgetPlanner.html">Budget Planner</a></li>
            <li class="text"><a href="/assects/pages/savingsGoals.html">Savings Goals</a></li>
            <li class="text"><a href="/assects/pages/reports.html">Reports</a></li>
        </ul>
        <span class="navTitle">Personal Finance Tracker</span>
    </div>
    <div class="intro">
        <h1 class="title">Budget Planner</h1>
        <p class="pageInfo">Plan and manage your budget effectively.</p>
    </div>
    <div class="incomeRowOne rowOne">
        <div class="addIncomeBox">
            <div class="addIncomeTitle">
                <h3>Add Budget</h3>
            </div>
            <div class="incomeInputs incomeTopBox">
                <form id="budgetForm" class="inputForm" action="#">
                    <label for="amount">Monthly Budget</label>
                    <input type="number" name="Monthly Budget" id="budgetAmountInput" placeholder="500" required>
                    <input type="submit" value="Add Budget">
                </form>
            </div>
        </div>
        <div class="totalIncome incomeTopBox">
            <table class="incomeSummaryCard card">
                <thead>
                    <th>Monthly Budget</th>
                </thead>
                <tbody>
                    <tr>
                        <td class="summaryName itemName">Current Budget</td>
                        <td id="currentBudgetValueSummary" class="value">$0</td>
                    </tr>
                    <tr>
                        <td class="summaryName itemName">Total Expenses</td>
                        <td id="totalExpensesSummary" class="value">$0</td>
                    </tr>
                    <tr>
                        <td class="summaryName itemName">Remaining Budget</td>
                        <td id="remainingBudget" class="value">$0</td>
                    </tr>
                    <tr>
                        <td class="summaryName itemName">Budget Used</td>
                        <td id="budgetUsedValue" class="value">0%</td>
                    </tr>
                    <tr>
                        <td class="summaryName itemName">Budget Remaining</td>
                        <td id="remainingBudgetValue" class="value">100%</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
